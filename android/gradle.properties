# 本文件只放与「构建机器无关」的配置；sdk.dir 在 local.properties（不入库）。
# Android applicationId/namespace 与 packages/core/src/naming.ts 的 androidPackage
# 保持一致（com.dsh.mobile.v2）；改它会导致旧 APK 无法覆盖安装。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# 构建属性名沿用 v2.*；v2.appName 是 APK 显示名。
v2.applicationId=com.dsh.mobile.v2
v2.appName=BBW
